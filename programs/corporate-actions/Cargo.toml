[package]
name = "corporate-actions"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "corporate_actions"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "bond-core/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
bond-core = { path = "../bond-core", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
[dev-dependencies]
litesvm = "0.11"
litesvm-token = "0.11"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-message = "3.0"
solana-transaction = "3.0"
solana-instruction = "3.0"
solana-pubkey = { version = "3.0", features = ["curve25519"] }
solana-clock = "3.0"
